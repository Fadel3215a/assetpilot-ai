services:
  db:
    image: postgres:17-alpine
    container_name: assetpilot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: assetpilot
      POSTGRES_PASSWORD: assetpilot
      POSTGRES_DB: assetpilot
    ports:
      - "5432:5432"
    volumes:
      - assetpilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assetpilot -d assetpilot"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  assetpilot_pgdata:
